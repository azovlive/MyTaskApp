<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Custom Task App</title>
  <style>
    * { box-sizing: border-box; }
    
    /* 1. 크롬 팝업창 최대 크기(800x600) 적용 */
    body { width: 800px; height: 600px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; background-color: #f9fafb; color: #1f2937; }
    
    .sidebar { width: 230px; background: #ffffff; border-right: 1px solid #e5e7eb; flex-shrink: 0; display: flex; flex-direction: column; }
    #smart-list-container { padding: 15px 10px 0; }
    #list-container { flex: 1; overflow-y: auto; padding: 0 10px 20px; }
    
    .sidebar-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .sidebar-item:hover { background-color: #f3f4f6; }
    .sidebar-item.active { background-color: #eff6ff; color: #2563eb; font-weight: 600; }
    .sidebar-item.drag-over { background-color: #dbeafe; outline: 2px dashed #3b82f6; outline-offset: -2px; }
    
    .list-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    
    .task-count { background-color: #f3f4f6; color: #6b7280; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; margin-left: 10px; }
    .sidebar-item:hover .task-count { background-color: #e5e7eb; }
    .sidebar-item.active .task-count { background-color: #bfdbfe; color: #1d4ed8; }
    
    .add-list-container { padding: 15px 10px; border-top: 1px solid #e5e7eb; display: flex; gap: 5px; background: #f9fafb; }
    .add-list-input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; outline: none; width: 100%; }
    .add-list-input:focus { border-color: #3b82f6; }
    .add-list-btn { padding: 8px 12px; background-color: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .add-list-btn:hover { background-color: #2563eb; }

    /* 2. 메인 영역 상하 여백을 줄여 작업 리스트 공간 확보 (padding 30px -> 20px) */
    .main { flex: 1; padding: 20px 30px; background: #ffffff; overflow-y: auto; }
    
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .main h2 { margin: 0; font-size: 24px; }
    .delete-list-btn { padding: 6px 12px; background-color: #fee2e2; color: #ef4444; border: 1px solid #f87171; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; display: none; transition: 0.2s; }
    .delete-list-btn:hover { background-color: #ef4444; color: white; }
    
    .add-task-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .add-task-input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    .add-task-input:focus { border-color: #3b82f6; }
    .add-task-btn { padding: 10px 15px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .add-task-btn:hover { background-color: #2563eb; }

    .task-group { min-height: 10px; }
    
    /* 3. 할 일 항목(Item)의 상하 패딩과 여백을 줄여 밀도(Compact)를 높임 */
    .task-item { display: flex; align-items: center; padding: 10px 15px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; cursor: grab; background: white; transition: 0.2s; }
    .task-item:hover { border-color: #3b82f6; }
    .task-item:active { cursor: grabbing; }
    .task-item.completed .task-title { text-decoration: line-through; color: #9ca3af; }
    .task-item.dragging { opacity: 0.5; border: 2px dashed #3b82f6; background-color: #eff6ff; }
    
    .checkbox-circle { width: 18px; height: 18px; border: 1px solid #9ca3af; border-radius: 50%; margin-right: 15px; flex-shrink: 0; cursor: pointer; }
    .checkbox-circle:hover { background-color: #e5e7eb; }
    .task-item.completed .checkbox-circle { background-color: #3b82f6; border-color: #3b82f6; }
    
    .task-content { flex: 1; overflow: hidden; margin-right: 10px; }
    .task-title { font-size: 14px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; }
    .task-due { font-size: 11px; color: #ef4444; margin-top: 2px; font-weight: 500; }
    
    .detail-panel { width: 0; overflow: hidden; background: #f9fafb; transition: width 0.3s ease-in-out; border-left: 1px solid transparent; flex-shrink: 0; }
    .detail-panel.open { width: 300px; border-left-color: #e5e7eb; }
    .detail-content { width: 300px; padding: 25px 20px; display: flex; flex-direction: column; height: 100%; }
    
    .close-btn { background: none; border: none; font-size: 14px; color: #6b7280; cursor: pointer; align-self: flex-end; margin-bottom: 15px; }
    .close-btn:hover { color: #ef4444; }
    #auth-btn { padding: 12px 20px; background-color: #4285F4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
    
    .edit-label { font-size: 12px; color: #6b7280; margin-bottom: 5px; font-weight: bold; }
    .edit-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; font-size: 14px;}
    
    .date-picker-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
    .edit-date-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .date-display { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; font-size: 14px; background: #ffffff; color: #1f2937; display: flex; align-items: center; justify-content: space-between; }
    .date-display .empty { color: #9ca3af; }

    .edit-textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; resize: none; margin-bottom: 15px; font-family: inherit; font-size: 14px;}
    
    .action-buttons { display: flex; gap: 10px; margin-top: auto; }
    .save-btn { flex: 1; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .save-btn:hover { background-color: #1d4ed8; }
    .detail-delete-btn { flex: 1; padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .detail-delete-btn:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div id="smart-list-container">
      <div class="sidebar-item" id="nav-today">
        <span class="list-name">☀️ 오늘 할 일</span>
        <span class="task-count" id="count-today" style="display: none;"></span>
      </div>
    </div>
    <hr style="margin: 15px 15px 5px; border: 0; border-top: 1px solid #e5e7eb;">
    
    <div id="list-container"></div>
    
    <div class="add-list-container" id="add-list-container" style="display: none;">
      <input type="text" id="newListInput" class="add-list-input" placeholder="새 목록 입력">
      <button id="addListBtn" class="add-list-btn">➕</button>
    </div>
  </div>

  <div class="main">
    <div class="main-header">
      <h2 id="current-list-title">작업 목록</h2>
      <button id="deleteListBtn" class="delete-list-btn">목록 삭제</button>
    </div>
    
    <button id="auth-btn">구글 계정 연결하기</button>

    <div class="add-task-container" id="add-task-container" style="display: none;">
      <input type="text" id="newTaskInput" class="add-task-input" placeholder="작업 추가 [엔터키로 저장]">
      <button id="addTaskBtn" class="add-task-btn">추가</button>
    </div>

    <div id="task-list"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-content">
      <button class="close-btn" id="close-btn">✕ 닫기</button>
      
      <div class="edit-label">제목</div>
      <input type="text" id="editTitle" class="edit-input" placeholder="할 일 제목">
      
      <div class="edit-label">마감일</div>
      <div class="date-picker-wrapper">
        <input type="date" id="editDue" class="edit-date-input">
        <div class="date-display">
          <span id="displayDueText">마감일 지정 안 됨</span>
          <span style="font-size: 16px; opacity: 0.7;">📅</span>
        </div>
      </div>

      <div class="edit-label">메모</div>
      <textarea id="editNotes" class="edit-textarea" placeholder="메모가 없습니다."></textarea>
      
      <div class="action-buttons">
        <button class="save-btn" id="save-btn">저장하기</button>
        <button class="detail-delete-btn" id="delete-btn">삭제</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
